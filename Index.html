<!DOCTYPE html>
<html lang="en">
<head>
<link rel="icon" type="image/png">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4efe6">
<title>My Shopping List</title>
<style>
*{box-sizing:border-box}
:root{--ivory:#f3eee4;--card:#fffdf9;--ink:#292a27;--muted:#77766e;--sage:#82927e;--line:#ded8cc}
body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:var(--ivory);color:var(--ink);position:relative}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:radial-gradient(rgba(80,70,55,.10) .45px,transparent .55px);background-size:5px 5px}
.app{width:100%;max-width:520px;min-height:100vh;margin:auto;padding:30px 18px 28px}
header{text-align:center;padding:8px 0 25px}
.mark{display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:rgba(255,253,249,.8);font-size:22px;margin-bottom:14px}
h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:32px;letter-spacing:.3px;font-weight:600}
.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px;letter-spacing:.3px}
.add{display:flex;gap:8px;margin-bottom:18px}
input{flex:1;min-width:0;height:50px;padding:0 15px;border:1px solid var(--line);border-radius:13px;background:rgba(255,253,249,.95);color:var(--ink);font-size:16px;outline:none}
input:focus{border-color:#aab6a6}
.add button{height:50px;min-width:55px;border:0;border-radius:13px;background:var(--ink);color:white;font-size:22px;cursor:pointer}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:20px 2px 8px;font-size:13px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted)}
.section-title button{border:0;background:none;color:var(--sage);font-weight:bold;cursor:pointer;font-size:13px}
ul{list-style:none;padding:0;margin:0}
li{background:var(--card);border:1px solid var(--line);margin:9px 0;min-height:62px;padding:10px 10px 10px 17px;border-radius:15px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(60,50,40,.035);transition:opacity .2s,transform .2s}
li span{flex:1;font-size:17px}
.check,.view{width:39px;height:39px;border:1px solid #d8ddd5;background:#eef2ec;color:#657461;border-radius:11px;font-size:18px;cursor:pointer}
.view{background:#f4f1eb;color:#77786f;font-size:17px}
.bought{opacity:.88}
.bought span{text-decoration:line-through;color:#85857d}
.empty{text-align:center;color:var(--muted);padding:38px 10px;line-height:1.6;font-size:15px}
.count{margin-top:16px;text-align:center;color:var(--muted);font-size:13px}
.bottom{display:flex;gap:9px;margin-top:20px}
.bottom button{flex:1;min-height:46px;background:rgba(255,253,249,.85);border:1px solid var(--line);border-radius:12px;color:#55564f;font-size:14px;cursor:pointer}
.footer{text-align:center;margin-top:25px;color:#aaa99f;font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.4px}
.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<header>
<div class="mark" aria-hidden="true">🛒</div>
<h1>My Shopping List</h1>
<p class="subtitle">Simple. Organized. Always with you.</p>
</header>

<div class="add">
<input id="itemInput" type="text" placeholder="Add an item..." autocomplete="off">
<button onclick="addItem()" aria-label="Add item">+</button>
</div>

<div class="section-title"><span>To Buy</span><span id="activeCount"></span></div>
<ul id="activeList"></ul>
<div id="empty" class="empty">Your list is empty.<br>Add your first item.</div>

<div class="section-title">
<span>Bought</span>
<button id="toggleBought" onclick="toggleBought()">Show bought</button>
</div>
<ul id="boughtList" class="hidden"></ul>

<div class="count" id="count"></div>

<div class="bottom">
<button onclick="restoreBought()">↩ Move bought back</button>
<button onclick="confirmClearAll()">Clear all</button>
</div>

<div id="confirmOverlay" class="confirm-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="confirm-box">
    <div class="confirm-icon">!</div>
    <h2 id="confirmTitle">Delete all items?</h2>
    <p>Are you sure you want to permanently remove every item from your shopping list?</p>
    <div class="confirm-actions">
      <button class="cancel-btn" onclick="closeConfirm()">No, keep them</button>
      <button class="delete-btn" onclick="clearAll()">Yes, delete all</button>
    </div>
  </div>
</div>

<div class="footer"></div>
</div>

<script>
const KEY="my_shopping_list_v3";
let items=JSON.parse(localStorage.getItem(KEY)||"[]");
let showBought=false;

function save(){localStorage.setItem(KEY,JSON.stringify(items));render()}
function addItem(){
 const input=document.getElementById("itemInput"),text=input.value.trim();
 if(!text)return;
 items.push({text,bought:false});input.value="";save();input.focus();
}
document.getElementById("itemInput").addEventListener("keydown",e=>{if(e.key==="Enter")addItem()});

function markBought(index){items[index].bought=true;save()}
function markToBuy(index){items[index].bought=false;save()}
function toggleBought(){showBought=!showBought;render()}
function restoreBought(){items.forEach(i=>{if(i.bought)i.bought=false});save()}
function confirmClearAll(){
 document.getElementById("confirmOverlay").classList.remove("hidden");
}
function closeConfirm(){
 document.getElementById("confirmOverlay").classList.add("hidden");
}
function clearAll(){
 items=[];
 closeConfirm();
 save();
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeConfirm()});
function render(){
 const activeList=document.getElementById("activeList"),boughtList=document.getElementById("boughtList");
 const empty=document.getElementById("empty"),count=document.getElementById("count");
 activeList.innerHTML="";boughtList.innerHTML="";
 const active=items.filter(i=>!i.bought),bought=items.filter(i=>i.bought);
 active.forEach(item=>{
   const index=items.indexOf(item),li=document.createElement("li");
   li.innerHTML=`<span>${escapeHtml(item.text)}</span><button class="check" onclick="markBought(${index})" title="Mark as bought">✓</button>`;
   activeList.appendChild(li);
 });
 bought.forEach(item=>{
   const index=items.indexOf(item),li=document.createElement("li");
   li.className="bought";
   li.innerHTML=`<span>${escapeHtml(item.text)}</span><button class="view" onclick="markToBuy(${index})" title="Move back to shopping list">◉</button>`;
   boughtList.appendChild(li);
 });
 empty.style.display=active.length?"none":"block";
 boughtList.classList.toggle("hidden",!showBought);
 document.getElementById("toggleBought").textContent=showBought?"Hide bought":"Show bought";
 document.getElementById("activeCount").textContent=active.length;
 count.textContent=`${active.length} ${active.length===1?"item":"items"} to buy · ${bought.length} bought`;
}
function escapeHtml(text){const d=document.createElement("div");d.textContent=text;return d.innerHTML}
render();
</script>
</body>
</html>
